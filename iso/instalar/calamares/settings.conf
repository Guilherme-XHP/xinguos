# Calamares do XInguOS (spec 5.2): instalação offline copiando o live (unpackfs),
# Btrfs com subvolumes, GRUB e pós-instalação própria (shellprocess@pos).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: pos
    module: shellprocess
    config: shellprocess_pos.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@pos
      - services-systemd
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: xinguos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
