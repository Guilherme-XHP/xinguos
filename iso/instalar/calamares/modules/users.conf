---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - wheel
  - video
  - audio
  - input
  - gamemode
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "xinguos-${cpu}"
  forbidden_names: [ localhost ]
