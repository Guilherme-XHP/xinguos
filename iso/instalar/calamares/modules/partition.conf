# Padrão: apagar o disco e usar Btrfs (spec 5.2). O disco do live (Ventoy) fica
# somente leitura pelo xinguos-protege-midia, para não ser apagado por engano.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices:
  - none
initialSwapChoice: none
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
