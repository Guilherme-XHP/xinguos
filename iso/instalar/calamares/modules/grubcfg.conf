---
# O grub do Arch já traz /etc/default/grub: sem always_use_defaults o Calamares ignoraria
# estes padrões (e o os-prober ficaria desligado, sem o Windows no menu). Com ele, só as
# chaves abaixo mudam; o resto do arquivo do Arch fica.
overwrite: false
keep_distributor: false
prefer_grub_d: false
always_use_defaults: true
# splash: plymouth com a logo do XInguOS (o Calamares só detecta o plymouth se houver o "which")
kernel_params: [ "quiet", "loglevel=3", "splash" ]
defaults:
  GRUB_TIMEOUT: 3
  # Btrfs: o GRUB não consegue gravar o grubenv, então "saved"/GRUB_SAVEDEFAULT não funcionam
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_DISABLE_RECOVERY: true
  GRUB_DISABLE_OS_PROBER: false
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_GFXMODE: "auto"
  GRUB_THEME: "/usr/share/grub/themes/xinguos/theme.txt"
